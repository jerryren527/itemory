appId: com.itemory
---
# Run Setup Flow
- runFlow: ../tests/setupEmulator.yaml
# Sign up with email of an existing google-only account -> "This email is already linked to Google. Please Log in with Google" error.
- assertVisible: Sign Up
- tapOn: Sign Up
- assertVisible:
    text: Email
    index: 1
- tapOn:
    text: Email
    index: 1
- inputText: googleonlyuser@example.com
- assertVisible:
    text: Password
    index: 1
- tapOn:
    text: Password
    index: 1
- inputText: Password123!!!
- assertVisible:
    text: Confirm Password
    index: 1
- tapOn:
    text: Confirm Password
    index: 1
- inputText: Password123!!!
- assertVisible: Create Account
- tapOn: Create Account
# - tapOn:
#     text: Not now
#     optional: true
# - tapOn:
#     text: "Never"
#     optional: true
- assertVisible: This email is already linked to Google. Please Log in with Google.
